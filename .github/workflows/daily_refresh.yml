name: Sincronización Diaria de Datos LIDOM

on:
  schedule:
    # Corre todos los días a las 4:00 AM AST / República Dominicana (08:00 UTC)
    # Permite asegurar que todos los juegos y boxscores del día anterior estén 100% cerrados
    - cron: '0 8 * * *'
  workflow_dispatch: # Permite ejecución manual bajo demanda desde GitHub Actions

permissions:
  contents: write

jobs:
  refresh-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar ingesta de datos LIDOM y Keep-Alive Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python refresh_data.py

      - name: Ejecutar suite de pruebas unitarias
        run: |
          python -m unittest discover tests

      - name: Guardar y commitear datos actualizados (Git Nativo)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.json
          if git diff --staged --quiet; then
            echo "No hay cambios nuevos en los datasets de LIDOM."
          else
            git commit -m "data: actualización diaria automatizada de datos LIDOM [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
